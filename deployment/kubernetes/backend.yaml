apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: saas-platform
data:
  ENVIRONMENT: development
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saas_db

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: saas-platform
type: Opaque
stringData:
  SECRET_KEY: change-this-secret-in-production

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: saas-platform
  labels:
    app: backend
    app.kubernetes.io/name: cloud-native-multi-tenant-saas
    app.kubernetes.io/part-of: saas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: cloud-native-multi-tenant-saas
        app.kubernetes.io/part-of: saas-platform
    spec:
      containers:
        - name: backend
          image: cloud-native-multi-tenant-saas-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DATABASE_URL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ENVIRONMENT
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: saas-platform
  labels:
    app: backend
    app.kubernetes.io/part-of: saas-platform
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000